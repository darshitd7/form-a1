<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1d2430; --muted:#667085; --line:#d9dde3; --accent:#0b6bcb; --accent-ink:#fff; --err:#b42318; --focus:#0b6bcb33; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#14171c; --card:#1d2128; --ink:#e6e8eb; --muted:#9aa3af; --line:#343a44; --accent:#4c9be8; --accent-ink:#0b1420; --err:#f97066; --focus:#4c9be840; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family:"Shruti","Nirmala UI",system-ui,sans-serif; padding:16px; }
  form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  img { display:block; width:88px; height:88px; margin:0 auto 12px; border-radius:50%; }
  h1 { font-size:18px; text-align:center; margin:0 0 18px; }
  label { display:block; font-size:14px; font-weight:600; margin:12px 0 4px; }
  input[type=text], input[type=password] { width:100%; font:inherit; font-size:16px; padding:9px 11px; border:1px solid var(--line);
         border-radius:7px; background:var(--card); color:var(--ink); }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--focus); }
  .row { display:flex; align-items:center; gap:6px; margin-top:12px; font-size:14px; }
  button { width:100%; margin-top:18px; font:inherit; font-weight:600; padding:10px; border-radius:8px; border:0;
           background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--err); font-size:14px; min-height:1.3em; margin-top:10px; text-align:center; }
</style>
</head>

const KEY_STORE = "formA1-key";
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));

async function deriveKey(user, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user.trim() + "\n" + pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(P.s), iterations: P.n, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function open(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(P.i) }, key, b(P.d)); // throws if wrong
  const html = new TextDecoder().decode(plain);
  window.__FORM_KEY = key;   // the app uses it to unlock each form's template
  document.open(); document.write(html); document.close();
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (saved) {
    try {
      const k = await crypto.subtle.importKey("raw", b(saved), "AES-GCM", false, ["decrypt"]);
      await open(k); return;
    } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (_) {} }
  }
  document.getElementById("u").focus();
})();
document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "ખોલી રહ્યા છીએ…";
  try {
    const key = await deriveKey(document.getElementById("u").value, document.getElementById("p").value);
    if (document.getElementById("r").checked) {
      try { localStorage.setItem(KEY_STORE, b64(await crypto.subtle.exportKey("raw", key))); } catch (_) {}
    }
    await open(key);
  } catch (x) {
    err.textContent = "યુઝરનેમ અથવા પાસવર્ડ ખોટો છે.";
    go.disabled = false;
    document.getElementById("p").select();
  }
});
</script>
